<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | GreenDen</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">GreenDen<span>.</span></a>

        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="page-banner">
        <h1>Let's Talk Plants 🌿</h1>
        <p>Have questions? We'd love to hear from you.</p>
    </section>

    <main class="contact-container">

        <div class="section-heading">
            <h2>Get in Touch</h2>
            <p>Fill out the form below to send us a message.</p>
        </div>

        <form class="contact-form" id="contactForm">

            <label>
                Your Name
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </label>

            <label>
                Email Address
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </label>

            <label>
                Subject
                <input
                    type="text"
                    name="subject"
                    placeholder="What would you like to know?"
                    required
                >
            </label>

            <label>
                Your Message
                <textarea
                    name="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>
            </label>

            <button type="submit" class="btn primary-btn">
                Send Message →
            </button>

            <p id="formMessage" role="status" aria-live="polite"></p>

        </form>

    </main>

    <footer>
        <a href="index.html" class="logo">GreenDen<span>.</span></a>
        <p>Growing happiness, one plant at a time. 🌱</p>
        <p class="copyright">© 2026 GreenDen. All rights reserved.</p>
    </footer>

    <script>
        const contactForm = document.getElementById("contactForm");
        const formMessage = document.getElementById("formMessage");

        contactForm.addEventListener("submit", function(event) {
            event.preventDefault();

            formMessage.textContent =
                "Thank you! Your form has been checked successfully.";

            formMessage.style.color = "#245c3a";

            contactForm.reset();
        });
    </script>

</body>
</html>
